spring:
  application:
    name: onmeet
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

livekit:
  url: ${LIVEKIT_URL:ws://localhost:7880}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{requestId}] %msg%n"
