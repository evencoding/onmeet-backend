services:
  nginx:
    image: nginx:1.25.3-alpine
    container_name: onmeet-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/www/certbot:ro
    depends_on:
      - gateway-service
    networks:
      - onmeet-network

  certbot:
    image: certbot/certbot:v2.7.4
    container_name: onmeet-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - onmeet-network

volumes:
  certbot-etc:
  certbot-var:


networks:
  onmeet-network:
    external: true
    name: onmeet-network
