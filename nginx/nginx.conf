server {
    listen 80;
    server_name api.onmeet.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.onmeet.cloud;

    ssl_certificate /etc/letsencrypt/live/api.onmeet.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.onmeet.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_log /var/log/nginx/api_error.log debug;

    resolver 127.0.0.11 valid=30s;

    location / {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 86400;
        proxy_read_timeout 86400;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

server {
    listen 80;
    server_name rtc.onmeet.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

upstream livekit-upstream {
    server livekit:7880;
}

server {
    listen 443 ssl;
    server_name rtc.onmeet.cloud;

    # SSL 설정 (사용자 확인: 개별 인증서 사용 중)
    ssl_certificate /etc/letsencrypt/live/rtc.onmeet.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.onmeet.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_log /var/log/nginx/livekit_error.log debug;

    resolver 127.0.0.11 valid=30s;

    location / {
        proxy_pass http://livekit-upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for stability
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }
}
