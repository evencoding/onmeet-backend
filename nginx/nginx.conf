worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateway {
        server gateway-service:8080;
    }

    upstream livekit {
        server livekit:7880;
    }

    include /etc/nginx/conf.d/*.conf;
}
