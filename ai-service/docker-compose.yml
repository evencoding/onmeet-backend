services:
  # MySQL Database for AI Service
  mysql-ai:
    image: mysql:9.0
    container_name: mysql-ai
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - mysql-ai-data:/var/lib/mysql
    networks:
      - onmeet-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Event Store
  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6380:6379"
    networks:
      - onmeet-network

  # LocalStack for S3 (개발 환경용)
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - AWS_DEFAULT_REGION=ap-northeast-2
    ports:
      - "4566:4566"

    networks:
      - onmeet-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Service
  ai-service:
    build:
      context: ../ # ✅ 프로젝트 루트(gradlew 있는 곳)
      dockerfile: ai-service/Dockerfile # ✅ Dockerfile 경로만 ai-service 폴더로
    container_name: ai-service
    ports:
      - "8082:8082"
    environment:
      # Database
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-ai:3306/ai_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

      # ✅ Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

      # AWS S3 (LocalStack)
      - AWS_REGION=ap-northeast-2
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=onmeet-transcripts

      # Application
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mysql-ai:
        condition: service_started
      kafka:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - onmeet-network
    restart: on-failure

volumes:
  mysql-ai-data:
    driver: local
  localstack-data:
    driver: local

networks:
  onmeet-network:
    name: onmeet-network
    driver: bridge
