services:
  # MySQL Database for AI Service
  mysql-ai:
    image: mysql:9.0
    container_name: mysql-ai
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - mysql-ai-data:/var/lib/mysql
    networks:
      - onmeet-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Event Store
  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis-ai-data:/data
    networks:
      - onmeet-network

  # AI Service
  ai-service:
    image: ${DOCKER_REGISTRY:-onmeet}/ai-service:latest
    container_name: ai-service
    ports:
      - "8082:8082"
    environment:
      # Database
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-ai:3306/ai_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

      # ✅ Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

      # Anthropic (Claude API)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # Application
      - SPRING_PROFILES_ACTIVE=docker
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET:-my-super-secret-gateway-key-1234!}
    depends_on:
      mysql-ai:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - onmeet-network
    restart: on-failure

networks:
  onmeet-network:
    external: true
    name: onmeet-network

volumes:
  mysql-ai-data:
  redis-ai-data:
