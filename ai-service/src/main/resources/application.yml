server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /ai
  forward-headers-strategy: framework
spring:
  application:
    name: ai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 600000
      keepalive-time: 30000
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": false
        "[show_sql]": false
        dialect: org.hibernate.dialect.MySQLDialect

gateway:
  shared-secret: ${GATEWAY_SHARED_SECRET}

onmeet:
  auth:
    internal-url: ${AUTH_INTERNAL_URL:http://auth-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 0.0 # Zipkin disabled (observability stack not running)

springdoc:
  api-docs:
    path: /v1/v3/api-docs

# VAD (Voice Activity Detection)
app:
  vad:
    enabled: ${VAD_ENABLED:false}
    model-path: classpath:models/silero_vad.onnx
    threshold: 0.5
    min-speech-duration-ms: 250
    min-silence-duration-ms: 300
    speech-pad-ms: 30
