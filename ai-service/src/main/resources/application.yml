server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /ai
  forward-headers-strategy: framework
spring:
  application:
    name: ai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 600000
      keepalive-time: 30000
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": false
        "[show_sql]": false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    baseline-on-migrate: true

gateway:
  shared-secret: ${GATEWAY_SHARED_SECRET:my-super-secret-gateway-key-1234!}

app:
  kafka:
    topics:
      audio-chunk-ready: ${KAFKA_TOPIC_AUDIO_CHUNK_READY:audio-chunk-ready}
      voice-segment-created: ${KAFKA_TOPIC_VOICE_SEGMENT_CREATED:voice-segment-created}
      transcript-finalized: ${KAFKA_TOPIC_TRANSCRIPT_FINALIZED:transcript-finalized}
      meeting-ended: ${KAFKA_TOPIC_MEETING_ENDED:meeting-ended}
      chat-events: ${KAFKA_TOPIC_CHAT_EVENTS:chat-events}
      minutes-generated: ${KAFKA_TOPIC_MINUTES_GENERATED:minutes-generated}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    endpoint: ${AWS_ENDPOINT:}
    bucket-name: ${S3_BUCKET_NAME:onmeet-transcripts}

onmeet:
  auth:
    internal-url: ${AUTH_INTERNAL_URL:http://auth-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 0.0 # Zipkin disabled (observability stack not running)

springdoc:
  api-docs:
    path: /v1/v3/api-docs

# VAD (Voice Activity Detection)
app:
  vad:
    enabled: ${VAD_ENABLED:false}
    model-path: classpath:models/silero_vad.onnx
    threshold: 0.5
    min-speech-duration-ms: 250
    min-silence-duration-ms: 300
    speech-pad-ms: 30
