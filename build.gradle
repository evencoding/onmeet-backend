plugins {
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.kapt' version '1.9.25' apply false
    id 'com.google.cloud.tools.jib' version '3.4.3' apply false
}

ext {
    springDocVersion = '2.6.0'
    springDocWebFluxVersion = '2.2.0'
    lombokVersion = '1.18.36'
    mapstructVersion = '1.6.2'
    lombokMapstructBindingVersion = '0.2.0'
    resilience4jVersion = '2.2.0'
}

subprojects {
    group = 'com.onmeet'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    if (it.name.endsWith("-service") && it.name != "file-service") {
        apply plugin: 'com.google.cloud.tools.jib'
        
        jib {
            from {
                image = 'eclipse-temurin:17-jre-jammy'
                platforms {
                    platform {
                        architecture = 'arm64'
                        os = 'linux'
                    }
                    platform {
                        architecture = 'amd64'
                        os = 'linux'
                    }
                }
            }
            to {
                // GitHub Actions에서 DOCKER_USERNAME 환경변수로 전달, 기본값은 'onmeet'
                def dockerRegistry = System.getenv('DOCKER_REGISTRY_PREFIX') ?: 'onmeet'
                image = "${dockerRegistry}/${project.name}"
                tags = ['latest', project.version]
            }
            container {
                creationTime = 'USE_CURRENT_TIMESTAMP'
                jvmFlags = ['-Xms512m', '-Xmx512m']
            }
        }
    }
}
