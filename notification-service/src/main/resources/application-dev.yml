# ──────────────────────────────────────────────
# 개발 환경 전용 설정 (dev profile)
# 실행: --spring.profiles.active=dev
# ──────────────────────────────────────────────
server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3311/notification_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[format_sql]": true
        "[show_sql]": true

# 개발 환경에서는 Gateway Secret 검증을 건너뛰기 위한 플래그
security:
  bypass-gateway: true

logging:
  level:
    com.onmeet.notification: DEBUG
