server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /notification
  forward-headers-strategy: framework
spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3311/notification_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 240000
      keepalive-time: 30000
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[format_sql]": true
        "[show_sql]": true
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.onmeet.notification.dto,com.onmeet.*"
        spring.json.value.default.type: com.onmeet.notification.dto.NotificationRequestDto
    listener:
      missing-topics-fatal: false

firebase:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  config-path: ${FIREBASE_CONFIG_PATH:firebase/serviceAccountKey.json}

gateway:
  shared-secret: ${GATEWAY_SHARED_SECRET:my-super-secret-gateway-key-1234!}

onmeet:
  auth:
    internal-url: ${AUTH_INTERNAL_URL:http://auth-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  tracing:
    enabled: false
    sampling:
      probability: 0.0

springdoc:
  api-docs:
    path: /v1/v3/api-docs
