server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3311/notification_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[format_sql]": true
        "[show_sql]": true
        dialect: org.hibernate.dialect.MySQLDialect

gateway:
  shared-secret: ${GATEWAY_SHARED_SECRET:my-secret-key-1234}

firebase:
  config-path: serviceAccountKey.json
