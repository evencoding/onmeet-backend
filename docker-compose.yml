version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: onmeet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: onmeet
      POSTGRES_USER: onmeet
      POSTGRES_PASSWORD: onmeet
    volumes:
      - onmeet_pgdata:/var/lib/postgresql/data
volumes:
  onmeet_pgdata:
