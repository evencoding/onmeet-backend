services:
  gateway-service:
    image: onmeet/gateway-service:latest
    pull_policy: never
    container_name: gateway-service
    ports:
      - "${GATEWAY_SERVICE_PORT:-8080}:${GATEWAY_SERVICE_PORT:-8080}"
    environment:
      # No DB Config needed
      - SERVER_PORT=${GATEWAY_SERVICE_PORT:-8080}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8081}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8082}
      - VIDEO_SERVICE_URL=${VIDEO_SERVICE_URL:-http://video-service:8083}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL:-http://chat-service:8084}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL:-http://notification-service:8085}
      - FILE_SERVICE_URL=${FILE_SERVICE_URL:-http://file-service:8086}
    networks:
      - msa-network

networks:
  msa-network:
    name: onmeet-network
    external: true
