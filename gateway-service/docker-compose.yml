services:
  gateway-service:
    build:
      context: ../
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      # No DB Config needed
      - SERVER_PORT=8080
    networks:
      - msa-network

networks:
  msa-network:
    name: onmeet-network
    external: true
