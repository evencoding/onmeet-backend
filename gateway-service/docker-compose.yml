services:
  mysql-gateway:
    image: mysql:9.0
    container_name: mysql-gateway
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gateway_db
    ports:
      - "3306:3306"
    networks:
      - msa-network

  gateway-service:
    build:
      context: ../
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-gateway:3306/gateway_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - mysql-gateway
    networks:
      - msa-network

networks:
  msa-network:
    name: onmeet-network
    external: true
