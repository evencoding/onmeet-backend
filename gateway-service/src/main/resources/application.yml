server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**, /.well-known/**
          filters:
            - TokenRelayFilter
        - id: ai-service
          uri: http://ai-service:8082
          predicates:
            - Path=/ai/**
          filters:
            - TokenRelayFilter
            - UserHeaderFilter
        - id: video-service
          uri: http://video-service:8083
          predicates:
            - Path=/video/**
          filters:
            - TokenRelayFilter
            - UserHeaderFilter
        - id: chat-service
          uri: http://chat-service:8084
          predicates:
            - Path=/chat/**
          filters:
            - TokenRelayFilter
            - UserHeaderFilter
        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/notification/**
          filters:
            - TokenRelayFilter
            - UserHeaderFilter
        - id: image-service
          uri: http://image-service:8086
          predicates:
            - Path=/image/**
          filters:
            - TokenRelayFilter
            - UserHeaderFilter
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8081/.well-known/jwks.json
