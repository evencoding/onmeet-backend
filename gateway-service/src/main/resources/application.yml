server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/auth/v1/**
          filters:
            - UserHeaderFilter
            - AddRequestHeader=X-Gateway-Secret, ${GATEWAY_SHARED_SECRET}
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://ai-service:8082}
          predicates:
            - Path=/ai/v1/**
          filters:
            - UserHeaderFilter
        - id: video-service
          uri: ${VIDEO_SERVICE_URL:http://video-service:8083}
          predicates:
            - Path=/video/v1/**
          filters:
            - UserHeaderFilter
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://chat-service:8084}
          predicates:
            - Path=/chat/v1/**
          filters:
            - UserHeaderFilter
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
          predicates:
            - Path=/notification/v1/**
          filters:
            - UserHeaderFilter
        - id: email-service
          uri: ${EMAIL_SERVICE_URL:http://email-service:8087}
          predicates:
            - Path=/email/v1/**
          filters:
            - UserHeaderFilter
        - id: file-service
          uri: ${FILE_SERVICE_URL:http://file-service:8086}
          predicates:
            - Path=/file/v1/**
          filters:
            - UserHeaderFilter
        - id: file-service-public
          uri: ${FILE_SERVICE_URL:http://file-service:8086}
          predicates:
            - Path=/file/swagger/**,/file/actuator/**
          filters:
            - UserHeaderFilter
      default-filters:
        - name: RequestRateLimiter
          args:
            "redis-rate-limiter.replenishRate": 10
            "redis-rate-limiter.burstCapacity": 20
            "redis-rate-limiter.requestedTokens": 1
            key-resolver: "#{@ipKeyResolver}"
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns:
              - "http://localhost:8080"
              - "http://localhost:[*]"
              - "http://127.0.0.1:[*]"
              - "https://onmeet.cloud"
              - "https://api.onmeet.cloud"
              - "https://*.onmeet.cloud"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
              - HEAD
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Content-Disposition"
            allowCredentials: true
            maxAge: 3600

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://auth-service:8081}/auth/v1/.well-known/jwks.json

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: auth-service
        url: /auth/v1/v3/api-docs
      - name: ai-service
        url: /ai/v1/v3/api-docs
      - name: video-service
        url: /video/v1/v3/api-docs
      - name: chat-service
        url: /chat/v1/v3/api-docs
      - name: notification-service
        url: /notification/v1/v3/api-docs
      - name: email-service
        url: /email/v1/v3/api-docs

      - name: file-service
        url: /file/swagger/doc.json

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0
