server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/auth/**
          filters:
            - UserHeaderFilter
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://ai-service:8082}
          predicates:
            - Path=/ai/**
          filters:
            - UserHeaderFilter
        - id: video-service
          uri: ${VIDEO_SERVICE_URL:http://video-service:8083}
          predicates:
            - Path=/video/**
          filters:
            - UserHeaderFilter
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://chat-service:8084}
          predicates:
            - Path=/chat/**
          filters:
            - UserHeaderFilter
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
          predicates:
            - Path=/notification/**
          filters:
            - UserHeaderFilter
        - id: image-service
          uri: ${IMAGE_SERVICE_URL:http://image-service:8086}
          predicates:
            - Path=/image/**
          filters:
            - UserHeaderFilter
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://auth-service:8081}/auth/.well-known/jwks.json
