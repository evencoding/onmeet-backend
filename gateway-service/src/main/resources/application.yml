server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/auth/**
          filters:
            - UserHeaderFilter
            - AddRequestHeader=X-Gateway-Secret, ${GATEWAY_SHARED_SECRET}
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://ai-service:8082}
          predicates:
            - Path=/ai/**
          filters:
            - UserHeaderFilter
        - id: video-service
          uri: ${VIDEO_SERVICE_URL:http://video-service:8083}
          predicates:
            - Path=/video/**
          filters:
            - UserHeaderFilter
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://chat-service:8084}
          predicates:
            - Path=/chat/**
          filters:
            - UserHeaderFilter
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
          predicates:
            - Path=/notification/**
          filters:
            - UserHeaderFilter
        - id: file-service
          uri: ${FILE_SERVICE_URL:http://file-service:8086}
          predicates:
            - Path=/file/**
          filters:
            - UserHeaderFilter
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:8080"
              - "http://localhost:3000" # Frontend (Future)
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://auth-service:8081}/auth/.well-known/jwks.json

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: auth-service
        url: /auth/v3/api-docs
      - name: ai-service
        url: /ai/v3/api-docs
      - name: video-service
        url: /video/v3/api-docs
      - name: chat-service
        url: /chat/v3/api-docs
      - name: notification-service
        url: /notification/v3/api-docs
      - name: email-service
        url: /email/v3/api-docs
      - name: file-service
        url: /file/swagger/doc.json

