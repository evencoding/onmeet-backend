plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.jetbrains.kotlin:kotlin-reflect'
    api 'org.jetbrains.kotlin:kotlin-stdlib'
    
    // For RequestContextHolder and ServletRequestAttributes
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Resilience4j
    api 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    api 'org.springframework.boot:spring-boot-starter-aop'

    // Feign Client
    api 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.3'

    // Observability
    api 'io.micrometer:micrometer-registry-prometheus'
    api 'io.micrometer:micrometer-tracing-bridge-brave'
    api 'io.zipkin.reporter2:zipkin-reporter-brave'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
