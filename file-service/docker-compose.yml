version: '3.8'

services:
  postgres-file:
    image: postgres:16-alpine
    container_name: postgres-file
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      POSTGRES_DB: file_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d file_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onmeet-network

  file-service:
    build:
      context: ./
    container_name: file-service
    ports:
      - "${FILE_SERVICE_PORT:-8086}:${FILE_SERVICE_PORT:-8086}"
    environment:
      - DB_URL=host=postgres-file user=${DB_USERNAME:-postgres} password=${DB_ROOT_PASSWORD:-root} dbname=file_db port=5432 sslmode=disable
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - SERVER_PORT=${FILE_SERVICE_PORT:-8086}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      postgres-file:
        condition: service_healthy
    networks:
      - onmeet-network

networks:
  onmeet-network:
    external: true
