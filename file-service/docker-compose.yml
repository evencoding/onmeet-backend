services:
  postgres-file:
    image: postgres:16-alpine
    container_name: postgres-file
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: file_db
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d file_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"  # MinIO API
      - "127.0.0.1:9001:9001"  # MinIO Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/file-bucket --ignore-existing;
      mc anonymous set download myminio/file-bucket;
      echo 'MinIO bucket initialized successfully';
      "
    networks:
      - onmeet-network

  file-service:
    image: ${DOCKER_REGISTRY:-onmeet}/file-service:latest
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      - DB_URL=host=postgres-file user=${DB_USERNAME} password=${DB_ROOT_PASSWORD} dbname=file_db port=5432 sslmode=disable
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - SERVER_PORT=${FILE_SERVICE_PORT:-8087}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-file-bucket}
      - S3_ENDPOINT=http://minio:9000
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:29092}
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      postgres-file:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M

volumes:
  minio-data:
    driver: local

networks:
  onmeet-network:
    external: true
