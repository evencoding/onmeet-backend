services:
  postgres-file:
    image: postgres:16-alpine
    container_name: postgres-file
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: file_db
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d file_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onmeet-network

  file-service:
    build:
      context: ./
    container_name: file-service
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      - DB_URL=host=postgres-file user=${DB_USERNAME} password=${DB_ROOT_PASSWORD} dbname=file_db port=5432 sslmode=disable
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - SERVER_PORT=${FILE_SERVICE_PORT:-8087}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:29092}
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      postgres-file:
        condition: service_healthy
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M

networks:
  onmeet-network:
    external: true
