services:
  mysql-file:
    image: mysql:9.0
    container_name: mysql-file
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: file_db
    ports:
      - "3312:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msa-network

  file-service:
    build:
      context: ../
      dockerfile: file-service/Dockerfile
    container_name: file-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-file:3306/file_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - SERVER_PORT=8086
      - MANAGEMENT_ENDPOINTS_WEB_BASE_PATH=/file/actuator
    depends_on:
      mysql-file:
        condition: service_healthy
    networks:
      - msa-network

networks:
  msa-network:
    name: onmeet-network
    external: true
