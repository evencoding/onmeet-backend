basePath: /file
definitions:
  handler.GenerateProfileRequest:
    properties:
      color:
        example: '#FF5733'
        type: string
      name:
        example: John Doe
        type: string
      ownerId:
        example: "123"
        type: string
      ownerType:
        example: USER
        type: string
    type: object
  model.FileMetadata:
    properties:
      category:
        type: string
      contentType:
        type: string
      createdAt:
        type: string
      extraInfo:
        description: datatypes.JSON은 PostgreSQL의 jsonb 타입을 지원하기 위한 특수 타입입니다.
        type: object
      fileName:
        type: string
      fileSize:
        type: integer
      id:
        description: |-
          백틱(`) 안에 있는 것은 'Struct Tag'라고 하며, GORM(ORM) 설정이나 JSON 변환 설정을 담습니다.
          gorm:"primaryKey"는 JPA의 @Id와 같고, json:"id"는 Jackson의 @JsonProperty("id")와 같습니다.
        type: integer
      originalFileName:
        type: string
      ownerId:
        type: string
      ownerType:
        type: string
      s3Url:
        type: string
      updatedAt:
        type: string
      uploaderId:
        description: '*int64처럼 포인터를 쓰는 이유는 DB의 NULL 값을 허용하기 위해서입니다. (Java의 클래스 타입
          Integer와 유사)'
        type: integer
    type: object
host: localhost:8086
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: File management service for OnMeet application.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: OnMeet File Service API
  version: "1.0"
paths:
  /{fileId}:
    delete:
      description: Delete file by ID (Soft delete in DB, Hard delete in S3).
      parameters:
      - description: File ID
        in: path
        name: fileId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete file
      tags:
      - file
    get:
      description: Get file metadata by ID.
      parameters:
      - description: File ID
        in: path
        name: fileId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.FileMetadata'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get file info
      tags:
      - file
  /profile/default:
    post:
      consumes:
      - application/json
      description: Generate a default profile image based on name and color.
      parameters:
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.GenerateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.FileMetadata'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate default profile image
      tags:
      - file
  /render/{fileId}:
    get:
      description: Download or render file content.
      parameters:
      - description: File ID
        in: path
        name: fileId
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Render file
      tags:
      - file
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload multiple files to S3.
      parameters:
      - description: Files to upload
        in: formData
        name: files
        required: true
        type: file
      - description: File category (e.g., TEAM_PROFILE)
        in: formData
        name: category
        type: string
      - description: Owner Type (e.g., USER, TEAM)
        in: formData
        name: ownerType
        type: string
      - description: Owner ID
        in: formData
        name: ownerId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.FileMetadata'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload files
      tags:
      - file
  /upload-async:
    post:
      consumes:
      - multipart/form-data
      description: Upload files asynchronously using Kafka.
      parameters:
      - description: Files to upload
        in: formData
        name: files
        required: true
        type: file
      - description: File category
        in: formData
        name: category
        type: string
      - description: Owner Type
        in: formData
        name: ownerType
        type: string
      - description: Owner ID
        in: formData
        name: ownerId
        type: string
      - description: Callback Kafka Topic
        in: formData
        name: callbackTopic
        type: string
      - description: Correlation ID
        in: formData
        name: correlationId
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
      summary: Upload files asynchronously
      tags:
      - file
swagger: "2.0"
