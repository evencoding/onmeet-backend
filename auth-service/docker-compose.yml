services:
  mysql-auth:
    image: mysql:9.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: auth_db
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M

  auth-service:
    image: ${DOCKER_REGISTRY:-onmeet}/auth-service:latest
    container_name: auth-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - SPRING_DATASOURCE_URL=${AUTH_DB_URL:-jdbc:mysql://mysql-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - AUTH_ENCRYPTION_KEY=${AUTH_ENCRYPTION_KEY}
      - PRIVACY_ENCRYPTION_KEY=${PRIVACY_ENCRYPTION_KEY}
      - SPRING_DATA_REDIS_HOST=${AUTH_REDIS_HOST:-redis-auth}
      - SERVER_PORT=${AUTH_SERVICE_PORT:-8081}
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - ONMEET_FILE_INTERNAL_URL=http://file-service:8086
    depends_on:
      mysql-auth:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 768M
        reservations:
          cpus: '0.10'
          memory: 256M

  # Trigger deployment

  redis-auth:
    image: redis:alpine
    container_name: redis-auth
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - onmeet-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

networks:
  onmeet-network:
    name: onmeet-network
