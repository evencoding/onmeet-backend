server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /auth
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true

app:
  team:
    initial-color: ${INITIAL_TEAM_COLOR:#FFFFFF}
    initial-description: ${INITIAL_TEAM_DESCRIPTION:Initial team}
  api-base-url: ${APP_API_BASE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v1/v3/api-docs

logging:
  level:
    root: INFO
    com.onmeet: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

onmeet:
  auth:
    internal-url: ${AUTH_INTERNAL_URL:http://auth-service:8081}
  file:
    internal-url: ${FILE_SERVICE_URL:http://file-service:8086}

resilience4j:
  circuitbreaker:
    instances:
      fileService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
