services:
  email-service:
    build:
      context: ../
      dockerfile: email-service/Dockerfile
    container_name: email-service
    ports:
      - "${EMAIL_SERVICE_PORT:-8087}:${EMAIL_SERVICE_PORT:-8087}"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-localhost}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SERVER_PORT=${EMAIL_SERVICE_PORT:-8087}
      - MANAGEMENT_ENDPOINTS_WEB_BASE_PATH=/email/actuator
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - msa-network

networks:
  msa-network:
    name: onmeet-network
    external: true
