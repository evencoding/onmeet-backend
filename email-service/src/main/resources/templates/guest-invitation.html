<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화상회의 초대</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f3f4f6;
            padding-bottom: 60px;
        }

        .main {
            background-color: #ffffff;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            border-spacing: 0;
            color: #1f2937;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin-top: 40px;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            padding: 40px 30px;
            text-align: center;
        }

        .header-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .content {
            padding: 40px 30px;
        }

        .greeting {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #111827;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 30px;
        }

        .highlight {
            color: #4f46e5;
            font-weight: 600;
        }

        .button-container {
            text-align: center;
            margin: 40px 0;
        }

        .cta-button {
            background-color: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer {
            background-color: #f9fafb;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }

        .footer-text {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
            line-height: 1.5;
        }

        .info-box {
            background-color: #f3f4f6;
            border-left: 4px solid #4f46e5;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 30px;
        }

        .info-title {
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 700;
            color: #4f46e5;
            margin: 0 0 8px 0;
            letter-spacing: 0.5px;
        }

        .info-text {
            margin: 0;
            font-size: 16px;
            color: #374151;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <center class="wrapper">
        <table class="main" width="100%">
            <tr>
                <td class="header">
                    <h1 class="header-title">Onmeet Video Conference</h1>
                </td>
            </tr>
            <tr>
                <td class="content">
                    <div class="greeting">초대장이 도착했습니다!</div>
                    <div class="message">
                        안녕하세요! <span class="highlight" th:text="${hostName}">호스트 이름</span>님이 귀하를 화상회의에 게스트로 초대했습니다.
                        Onmeet과 함께 원활하고 안전한 가상 회의를 경험하세요.
                    </div>

                    <div class="info-box">
                        <p class="info-title">회의실</p>
                        <p class="info-text" th:text="${roomName}">회의실 이름</p>
                    </div>

                    <div class="message" style="margin-bottom: 10px;">
                        아래 버튼을 클릭하여 안전하게 회의에 참여하세요. 게스트로 참여하는 데 계정 생성은 필요하지 않습니다!
                    </div>

                    <div class="button-container">
                        <a th:href="${joinLink}" class="cta-button">회의 참여하기</a>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="footer">
                    <p class="footer-text">This is an automated message from Onmeet secure servers.</p>
                    <p class="footer-text" style="margin-top: 10px;">&copy; 2026 Onmeet Corporation. All rights
                        reserved.</p>
                </td>
            </tr>
        </table>
    </center>
</body>

</html>
