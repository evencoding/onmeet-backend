<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회사 초대</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f3f4f6;
            padding-bottom: 60px;
        }

        .main {
            background-color: #ffffff;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            border-spacing: 0;
            color: #1f2937;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin-top: 40px;
        }

        .header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 40px 30px;
            text-align: center;
        }

        .header-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .content {
            padding: 40px 30px;
        }

        .greeting {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #111827;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 30px;
        }

        .highlight {
            color: #10b981;
            font-weight: 600;
        }

        .code-container {
            text-align: center;
            margin: 30px 0;
            padding: 24px;
            background-color: #f0fdf4;
            border: 2px dashed #34d399;
            border-radius: 12px;
        }

        .code-title {
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 700;
            color: #059669;
            margin: 0 0 12px 0;
            letter-spacing: 0.5px;
        }

        .code-value {
            font-size: 32px;
            font-family: monospace;
            font-weight: 800;
            color: #065f46;
            margin: 0;
            letter-spacing: 6px;
        }

        .footer {
            background-color: #f9fafb;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }

        .footer-text {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <center class="wrapper">
        <table class="main" width="100%">
            <tr>
                <td class="header">
                    <h1 class="header-title">Onmeet Registration</h1>
                </td>
            </tr>
            <tr>
                <td class="content">
                    <div class="greeting">OnMeet 팀에 오신 것을 환영합니다!</div>
                    <div class="message">
                        <p>안녕하세요,</p>
                        <p>OnMeet의 <strong><span th:text="${companyName}">회사명</span></strong> 워크스페이스에 초대되셨습니다.</p>
                    </div>

                    <div class="code-container">
                        <p class="code-title">가입 초대 코드:</p>
                        <p class="code-value" th:text="${invitationCode}">XXXXXX</p>
                    </div>

                    <div class="message" style="margin-bottom: 10px;">
                        회원가입 페이지에서 위 코드를 입력하여 회사 워크스페이스에 합류해 주세요.
                    </div>
                </td>
            </tr>
            <tr>
                <td class="footer">
                    <p class="footer-text">본 메일은 OnMeet에서 자동으로 발송되었습니다. 회신하지 마십시오.</p>
                    <p class="footer-text" style="margin-top: 10px;">&copy; 2026 Onmeet Corporation. All rights
                        reserved.</p>
                </td>
            </tr>
        </table>
    </center>
</body>

</html>
