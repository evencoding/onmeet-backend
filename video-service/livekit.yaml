port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  use_external_ip: true

# API keys are passed via LIVEKIT_KEYS environment variable in docker-compose.yml
keys: {}

redis:
  address: redis:6379

webhook:
  api_key: "${LIVEKIT_API_KEY}"
  urls:
    - "http://video-service:8083/video/webhook/livekit"

logging:
  level: info
