services:
  mysql-video:
    image: mysql:9.0
    container_name: mysql-video
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: video_db
    ports:
      - "127.0.0.1:3309:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M

  video-service:
    image: ${DOCKER_REGISTRY:-onmeet}/video-service:latest
    container_name: video-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=${VIDEO_DB_URL:-jdbc:mysql://mysql-video:3306/video_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - SERVER_PORT=${VIDEO_SERVICE_PORT:-8083}
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - MANAGEMENT_ENDPOINTS_WEB_BASE_PATH=/video/actuator
    depends_on:
      mysql-video:
        condition: service_healthy
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M

networks:
  onmeet-network:
