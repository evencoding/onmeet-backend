services:
  mysql-video:
    image: mysql:9.0
    container_name: mysql-video
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: video_db
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - mysql-video-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_EXTERNAL_IP: ${LIVEKIT_EXTERNAL_IP}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
    volumes:
      - ./livekit.yaml:/etc/livekit-template.yaml:ro
    entrypoint: /bin/sh
    command: >
      -c "sed -e 's/$${LIVEKIT_API_KEY}/'\"$$LIVEKIT_API_KEY\"'/g' -e 's/$${LIVEKIT_API_SECRET}/'\"$$LIVEKIT_API_SECRET\"'/g' /etc/livekit-template.yaml > /tmp/livekit.yaml
      && exec /livekit-server --config /tmp/livekit.yaml --node-ip $$LIVEKIT_EXTERNAL_IP"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M

  livekit-egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-devsecret}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        s3:
          access_key: minioadmin
          secret: minioadmin
          bucket: onmeet-dev-media-origin
          endpoint: http://minio:9000
          region: ap-northeast-2
          force_path_style: true
        cpu_cost:
          track_cpu_cost: 0.1
          max_cpu_utilization: 0.95
    depends_on:
      livekit:
        condition: service_healthy
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  video-service:
    image: ${DOCKER_REGISTRY:-onmeet}/video-service:latest
    container_name: video-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - SPRING_DATASOURCE_URL=${VIDEO_DB_URL:-jdbc:mysql://mysql-video:3306/video_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - SERVER_PORT=${VIDEO_SERVICE_PORT:-8083}
      - LIVEKIT_ENABLED=${LIVEKIT_ENABLED:-false}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_INTERNAL_URL=${LIVEKIT_INTERNAL_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - EGRESS_S3_ACCESS_KEY=${EGRESS_S3_ACCESS_KEY:-minioadmin}
      - EGRESS_S3_SECRET=${EGRESS_S3_SECRET:-minioadmin}
      - EGRESS_S3_BUCKET=${EGRESS_S3_BUCKET:-onmeet-dev-media-origin}
      - EGRESS_S3_ENDPOINT=${EGRESS_S3_ENDPOINT:-http://minio:9000}
      - EGRESS_S3_REGION=${EGRESS_S3_REGION:-ap-northeast-2}
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
    depends_on:
      mysql-video:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - onmeet-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 768M
        reservations:
          cpus: '0.10'
          memory: 256M

networks:
  onmeet-network:
    external: true
    name: onmeet-network

volumes:
  mysql-video-data:
