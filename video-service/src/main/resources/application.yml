server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /video
  forward-headers-strategy: framework
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:chat}
  application:
    name: video-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/video_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 240000
      keepalive-time: 30000
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

gateway:
  shared-secret: ${GATEWAY_SHARED_SECRET}

onmeet:
  auth:
    internal-url: ${AUTH_INTERNAL_URL:http://auth-service:8081}
  notification:
    internal-url: ${NOTIFICATION_INTERNAL_URL:http://notification-service:8085}
cors:
  allowed-origins: "http://localhost:3000,http://localhost:8080"

livekit:
  url: ${LIVEKIT_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:devsecret}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 0.0 # Zipkin disabled (observability stack not running)

springdoc:
  api-docs:
    path: /v1/v3/api-docs
