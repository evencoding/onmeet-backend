server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /video
  forward-headers-strategy: framework
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:chat}
  autoconfigure:
    exclude: com.onmeet.common.config.CommonWebAutoConfiguration
  application:
    name: video-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/video_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 240000
      keepalive-time: 30000
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

gateway:
  shared-secret: ${GATEWAY_SHARED_SECRET:my-super-secret-gateway-key-1234!}

# TODO: [VIDEO][FILE_SERVICE] 파일 서버 연동 설정 추가 필요
# app:
#   storage:
#     file-service:
#       internal-url: ${FILE_SERVICE_URL:http://file-service:8084}

onmeet:
  auth:
    internal-url: ${AUTH_INTERNAL_URL:http://auth-service:8081}
cors:
  allowed-origins: "http://localhost:3000,http://localhost:8080"

livekit:
  enabled: ${LIVEKIT_ENABLED:false}
  url: ${LIVEKIT_URL:ws://localhost:7880}
  internal-url: ${LIVEKIT_INTERNAL_URL:${LIVEKIT_URL:ws://localhost:7880}}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:devsecret}
  s3:
    access-key: ${EGRESS_S3_ACCESS_KEY:minioadmin}
    secret: ${EGRESS_S3_SECRET:minioadmin}
    bucket: ${EGRESS_S3_BUCKET:onmeet-dev-media-origin}
    endpoint: ${EGRESS_S3_ENDPOINT:http://minio:9000}
    region: ${EGRESS_S3_REGION:ap-northeast-2}
    force-path-style: ${EGRESS_S3_FORCE_PATH_STYLE:true}

kafka:
  enabled: ${KAFKA_ENABLED:false}

spring.kafka:
  bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 0.0 # Zipkin disabled (observability stack not running)

springdoc:
  api-docs:
    path: /v1/v3/api-docs
