services:
  mysql-chat:
    image: mysql:9.0
    container_name: mysql-chat
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: chat_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_chat_data:/var/lib/mysql
    networks:
      - msa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 2s
      retries: 30

  redis-chat:
    image: redis:7-alpine
    container_name: redis-chat
    ports:
      - "6380:6379"
    networks:
      - msa-network
    restart: unless-stopped

  chat-service:
    build:
      context: ../
      dockerfile: chat-service/Dockerfile
    container_name: chat-service
    ports:
      - "8084:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-chat:3306/chat_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
