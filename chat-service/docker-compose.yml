services:
  mysql-chat:
    image: mysql:9.0
    container_name: mysql-chat
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: chat_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_chat_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msa-network
    restart: unless-stopped

  redis-chat:
    image: redis:7-alpine
    container_name: redis-chat
    ports:
      - "6380:6379"
    networks:
      - msa-network
    restart: unless-stopped

  chat-service:
    build:
      context: ../
      dockerfile: chat-service/Dockerfile
    container_name: chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-8084}:${CHAT_SERVICE_PORT:-8084}"
    environment:
      - SPRING_DATASOURCE_URL=${CHAT_DB_URL:-jdbc:mysql://mysql-chat:3306/chat_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - SERVER_PORT=${CHAT_SERVICE_PORT:-8084}
      - MANAGEMENT_ENDPOINTS_WEB_BASE_PATH=/chat/actuator
      - SPRING_DATA_REDIS_HOST=redis-chat
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      mysql-chat:
        condition: service_healthy
      redis-chat:
        condition: service_started
    networks:
      - msa-network
    restart: unless-stopped

networks:
  msa-network:
    name: onmeet-network
    external: true

volumes:
  mysql_chat_data:
