<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>STOMP Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h3>STOMP Test</h3>

<div>
    <label>WS Endpoint:</label>
    <input id="endpoint" value="http://localhost:8084/ws-chat" style="width:300px;">
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
</div>

<div style="margin-top:10px;">
    <label>RoomId:</label>
    <input id="roomId" value="1" style="width:80px;">
    <button onclick="subscribeRoom()">Subscribe</button>
    <button onclick="joinRoom()">Join</button>
    <button onclick="leaveRoom()">Leave</button>
</div>

<div style="margin-top:10px;">
    <label>Message:</label>
    <input id="msg" value="hello" style="width:300px;">
    <button onclick="send()">Send</button>
</div>

<pre id="log" style="margin-top:15px; background:#111; color:#0f0; padding:10px; height:300px; overflow:auto;"></pre>

<script>
    let stompClient = null;

    function log(line) {
      const el = document.getElementById("log");
      el.textContent += line + "\n";
      el.scrollTop = el.scrollHeight;
    }

    function connect() {
      const endpoint = document.getElementById("endpoint").value;

      // SockJS 사용 (스프링에서 보통 SockJS 허용해둠)
      const socket = new SockJS(endpoint);
      stompClient = Stomp.over(socket);
      stompClient.debug = (str) => log(str);

      stompClient.connect({}, (frame) => {
        log("✅ Connected: " + frame);
      }, (err) => {
        log("❌ Connect error: " + JSON.stringify(err));
      });
    }

    function disconnect() {
      if (stompClient) stompClient.disconnect(() => log("🔌 Disconnected"));
    }

    function subscribeRoom() {
      const roomId = document.getElementById("roomId").value;
      stompClient.subscribe("/topic/room/" + roomId, (message) => {
        log("📩 Received: " + message.body);
      });
      log("👂 Subscribed to /topic/room/" + roomId);
    }

    function joinRoom() {
      const roomId = Number(document.getElementById("roomId").value);
      stompClient.send("/app/chat.join", {}, JSON.stringify({ meetRoomId: roomId }));
      log("➡️ Sent join");
    }

    function leaveRoom() {
      const roomId = Number(document.getElementById("roomId").value);
      stompClient.send("/app/chat.leave", {}, JSON.stringify({ meetRoomId: roomId }));
      log("➡️ Sent leave");
    }

    function send() {
      const roomId = Number(document.getElementById("roomId").value);
      const msg = document.getElementById("msg").value;

      // ChatSendRequestDto 필드명에 맞춰야 함 (아래는 흔한 형태로 가정)
      const payload = {
        meetRoomId: roomId,
        content: msg,
        messageType: "TEXT"
      };

      stompClient.send("/app/chat.send", {}, JSON.stringify(payload));
      log("➡️ Sent message: " + JSON.stringify(payload));
    }
</script>
</body>
</html>
