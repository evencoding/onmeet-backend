name: Java CI with Gradle

on:
  push:
    branches: [ "develop", "main", "feature/*" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'corretto'

    # Create application.yml for each service from Secrets
    # NOTE: You must add these secrets in GitHub Repo Settings > Secrets and variables > Actions
    
    - name: Create Auth Service Config
      run: |
        mkdir -p auth-service/src/main/resources
        echo "${{ secrets.AUTH_SERVICE_YML }}" > auth-service/src/main/resources/application.yml

    - name: Create Gateway Service Config
      run: |
        mkdir -p gateway-service/src/main/resources
        echo "${{ secrets.GATEWAY_SERVICE_YML }}" > gateway-service/src/main/resources/application.yml

    - name: Create Chat Service Config
      run: |
        mkdir -p chat-service/src/main/resources
        echo "${{ secrets.CHAT_SERVICE_YML }}" > chat-service/src/main/resources/application.yml
        
    - name: Create AI Service Config
      run: |
        mkdir -p ai-service/src/main/resources
        echo "${{ secrets.AI_SERVICE_YML }}" > ai-service/src/main/resources/application.yml

    - name: Create Image Service Config
      run: |
        mkdir -p image-service/src/main/resources
        echo "${{ secrets.IMAGE_SERVICE_YML }}" > image-service/src/main/resources/application.yml
        
    - name: Create Notification Service Config
      run: |
        mkdir -p notification-service/src/main/resources
        echo "${{ secrets.NOTIFICATION_SERVICE_YML }}" > notification-service/src/main/resources/application.yml

    - name: Create Video Service Config
      run: |
        mkdir -p video-service/src/main/resources
        echo "${{ secrets.VIDEO_SERVICE_YML }}" > video-service/src/main/resources/application.yml

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle Wrapper
      run: ./gradlew build -x test
