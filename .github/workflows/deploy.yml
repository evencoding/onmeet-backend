name: CI/CD Pipeline for Onmeet Backend

on:
  push:
    branches:
      - 'release/**'  # release/v0.1.0, release/v0.2.0 등 버전별 릴리즈 브랜치

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # Job 1: 변경된 서비스 감지 및 버전 추출
  detect-changes:
    name: Detect Changed Services & Extract Version
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.changes.outputs.auth }}
      gateway: ${{ steps.changes.outputs.gateway }}
      ai: ${{ steps.changes.outputs.ai }}
      video: ${{ steps.changes.outputs.video }}
      chat: ${{ steps.changes.outputs.chat }}
      notification: ${{ steps.changes.outputs.notification }}
      email: ${{ steps.changes.outputs.email }}
      file: ${{ steps.changes.outputs.file }}
      any-service-changed: ${{ steps.changes.outputs.any-service-changed }}
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 이전 커밋과 비교를 위해 최소 2개 커밋 필요

      - name: Detect changes in services
        id: changes
        run: |
          # 변경된 파일 목록 가져오기
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # 공통 라이브러리 변경 확인
          COMMON_CHANGED=false
          if echo "$CHANGED_FILES" | grep -q "^onmeet-common/\|^common-security/\|^build.gradle\|^settings.gradle"; then
            COMMON_CHANGED=true
            echo "Common libraries or build files changed - will rebuild all Kotlin/Java services"
          fi

          # 각 서비스별 변경 감지
          ANY_CHANGED=false

          # auth-service
          if echo "$CHANGED_FILES" | grep -q "^auth-service/" || [ "$COMMON_CHANGED" == "true" ]; then
            echo "auth=true" >> $GITHUB_OUTPUT
            ANY_CHANGED=true
          else
            echo "auth=false" >> $GITHUB_OUTPUT
          fi

          # gateway-service
          if echo "$CHANGED_FILES" | grep -q "^gateway-service/" || [ "$COMMON_CHANGED" == "true" ]; then
            echo "gateway=true" >> $GITHUB_OUTPUT
            ANY_CHANGED=true
          else
            echo "gateway=false" >> $GITHUB_OUTPUT
          fi

          # ai-service
          if echo "$CHANGED_FILES" | grep -q "^ai-service/" || [ "$COMMON_CHANGED" == "true" ]; then
            echo "ai=true" >> $GITHUB_OUTPUT
            ANY_CHANGED=true
          else
            echo "ai=false" >> $GITHUB_OUTPUT
          fi

          # video-service
          if echo "$CHANGED_FILES" | grep -q "^video-service/" || [ "$COMMON_CHANGED" == "true" ]; then
            echo "video=true" >> $GITHUB_OUTPUT
            ANY_CHANGED=true
          else
            echo "video=false" >> $GITHUB_OUTPUT
          fi

          # chat-service
          if echo "$CHANGED_FILES" | grep -q "^chat-service/" || [ "$COMMON_CHANGED" == "true" ]; then
            echo "chat=true" >> $GITHUB_OUTPUT
            ANY_CHANGED=true
          else
            echo "chat=false" >> $GITHUB_OUTPUT
          fi

          # notification-service
          if echo "$CHANGED_FILES" | grep -q "^notification-service/" || [ "$COMMON_CHANGED" == "true" ]; then
            echo "notification=true" >> $GITHUB_OUTPUT
            ANY_CHANGED=true
          else
            echo "notification=false" >> $GITHUB_OUTPUT
          fi

          # email-service
          if echo "$CHANGED_FILES" | grep -q "^email-service/" || [ "$COMMON_CHANGED" == "true" ]; then
            echo "email=true" >> $GITHUB_OUTPUT
            ANY_CHANGED=true
          else
            echo "email=false" >> $GITHUB_OUTPUT
          fi

          # file-service (Go - 별도 처리)
          if echo "$CHANGED_FILES" | grep -q "^file-service/"; then
            echo "file=true" >> $GITHUB_OUTPUT
            ANY_CHANGED=true
          else
            echo "file=false" >> $GITHUB_OUTPUT
          fi

          echo "any-service-changed=$ANY_CHANGED" >> $GITHUB_OUTPUT

      - name: Extract version from branch name
        id: extract-version
        run: |
          # release/v0.1.0 → v0.1.0 추출
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch name: $BRANCH_NAME"

          if [[ $BRANCH_NAME =~ release/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="v${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Extracted version: $VERSION"
          elif [[ $BRANCH_NAME =~ release/(v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Extracted version: $VERSION"
          else
            # 버전 정보가 없으면 latest만 사용
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "No version found, using 'latest'"
          fi

  # Job 2: 변경된 서비스 빌드 및 푸시
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: |
          needs.detect-changes.outputs.auth == 'true' ||
          needs.detect-changes.outputs.gateway == 'true' ||
          needs.detect-changes.outputs.ai == 'true' ||
          needs.detect-changes.outputs.video == 'true' ||
          needs.detect-changes.outputs.chat == 'true' ||
          needs.detect-changes.outputs.notification == 'true' ||
          needs.detect-changes.outputs.email == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: |
          needs.detect-changes.outputs.auth == 'true' ||
          needs.detect-changes.outputs.gateway == 'true' ||
          needs.detect-changes.outputs.ai == 'true' ||
          needs.detect-changes.outputs.video == 'true' ||
          needs.detect-changes.outputs.chat == 'true' ||
          needs.detect-changes.outputs.notification == 'true' ||
          needs.detect-changes.outputs.email == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Login to Docker Hub for Jib
        if: |
          needs.detect-changes.outputs.auth == 'true' ||
          needs.detect-changes.outputs.gateway == 'true' ||
          needs.detect-changes.outputs.ai == 'true' ||
          needs.detect-changes.outputs.video == 'true' ||
          needs.detect-changes.outputs.chat == 'true' ||
          needs.detect-changes.outputs.notification == 'true' ||
          needs.detect-changes.outputs.email == 'true'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build changed Kotlin/Java services with Jib
        if: |
          needs.detect-changes.outputs.auth == 'true' ||
          needs.detect-changes.outputs.gateway == 'true' ||
          needs.detect-changes.outputs.ai == 'true' ||
          needs.detect-changes.outputs.video == 'true' ||
          needs.detect-changes.outputs.chat == 'true' ||
          needs.detect-changes.outputs.notification == 'true' ||
          needs.detect-changes.outputs.email == 'true'
        env:
          DOCKER_REGISTRY_PREFIX: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ needs.detect-changes.outputs.version }}
        run: |
          # 변경된 서비스만 빌드하도록 동적으로 타겟 생성
          TARGETS=""

          if [ "${{ needs.detect-changes.outputs.auth }}" == "true" ]; then
            TARGETS="$TARGETS :auth-service:jib"
          fi
          if [ "${{ needs.detect-changes.outputs.gateway }}" == "true" ]; then
            TARGETS="$TARGETS :gateway-service:jib"
          fi
          if [ "${{ needs.detect-changes.outputs.ai }}" == "true" ]; then
            TARGETS="$TARGETS :ai-service:jib"
          fi
          if [ "${{ needs.detect-changes.outputs.video }}" == "true" ]; then
            TARGETS="$TARGETS :video-service:jib"
          fi
          if [ "${{ needs.detect-changes.outputs.chat }}" == "true" ]; then
            TARGETS="$TARGETS :chat-service:jib"
          fi
          if [ "${{ needs.detect-changes.outputs.notification }}" == "true" ]; then
            TARGETS="$TARGETS :notification-service:jib"
          fi
          if [ "${{ needs.detect-changes.outputs.email }}" == "true" ]; then
            TARGETS="$TARGETS :email-service:jib"
          fi

          if [ -n "$TARGETS" ]; then
            echo "Building services:$TARGETS"
            echo "Docker registry: $DOCKER_REGISTRY_PREFIX"
            echo "Version tag: $VERSION"

            # 버전 태그와 latest 태그 모두 생성
            if [ "$VERSION" != "latest" ]; then
              TAG_LIST="latest,$VERSION"
            else
              TAG_LIST="latest"
            fi

            ./gradlew $TARGETS \
              -Djib.to.auth.username=${{ secrets.DOCKER_USERNAME }} \
              -Djib.to.auth.password=${{ secrets.DOCKER_PASSWORD }} \
              -Djib.to.tags=$TAG_LIST \
              --parallel \
              --no-daemon \
              --no-configuration-cache \
              -x test
          else
            echo "No Kotlin/Java services to build"
          fi

      - name: Set up Docker Buildx
        if: needs.detect-changes.outputs.file == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push file-service (Go)
        if: needs.detect-changes.outputs.file == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./file-service
          file: ./file-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/file-service:latest
            ${{ secrets.DOCKER_USERNAME }}/file-service:${{ needs.detect-changes.outputs.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: GCP 서버에 배포
  deploy:
    name: Deploy to GCP Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    steps:
      - name: Deploy to GCP via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: ${{ secrets.GCP_SSH_PORT }}
          script: |
            cd ${{ secrets.GCP_PROJECT_PATH }}

            # Docker Hub 로그인
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 최신 이미지 pull
            docker compose pull

            # 서비스 재시작 (무중단 배포)
            docker compose up -d --remove-orphans

            # 사용하지 않는 이미지 정리
            docker image prune -f

            echo "Deployment completed successfully!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: ${{ secrets.GCP_SSH_PORT }}
          script: |
            cd ${{ secrets.GCP_PROJECT_PATH }}

            # 컨테이너 상태 확인
            docker compose ps

            # 헬스체크 (gateway-service 기준)
            max_attempts=30
            attempt=0
            until curl -f http://localhost:8080/actuator/health || [ $attempt -eq $max_attempts ]; do
              attempt=$((attempt+1))
              echo "Waiting for services to be healthy... ($attempt/$max_attempts)"
              sleep 2
            done

            if [ $attempt -eq $max_attempts ]; then
              echo "Health check failed after $max_attempts attempts"
              exit 1
            fi

            echo "All services are healthy!"
