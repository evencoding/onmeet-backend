name: Bug Report
description: 재현 가능한 문제를 보고해주세요
title: "[버그] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 발생한 문제와 기대했던 동작을 적어주세요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 문제를 재현하기 위한 최소한의 절차를 적어주세요
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전/커밋
      description: 관련 버전 또는 커밋 해시를 적어주세요
  - type: textarea
    id: logs
    attributes:
      label: 로그/스택트레이스
      render: shell
  - type: textarea
    id: env
    attributes:
      label: 환경 정보
      description: 운영 체제, JDK, 데이터베이스, 브라우저 등을 적어주세요
