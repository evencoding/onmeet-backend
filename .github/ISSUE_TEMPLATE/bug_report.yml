name: Bug Report
description: Report a reproducible issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: Relevant version or commit hash
  - type: textarea
    id: logs
    attributes:
      label: Logs/Stacktrace
      render: shell
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, JDK, DB, etc.
